<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vulnmgmt — Risk-Based Vulnerability Management (Live Demo)</title>
<style>
:root {
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --series:#2a78d6; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-650:#104281;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series:#3987e5; --good-text:#0ca30c;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
.demobar { background:var(--series); color:#fff; text-align:center; padding:6px 16px; font-size:12.5px; }
header { display:flex; align-items:center; gap:16px; padding:12px 24px;
  background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; font-weight:650; }
header .sub { color:var(--muted); font-size:12px; }
nav { display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
nav button { border:0; background:none; color:var(--ink2); padding:6px 12px;
  border-radius:6px; cursor:pointer; font:inherit; }
nav button.active { background:var(--series); color:#fff; }
nav button:hover:not(.active) { background:var(--grid); }
main { padding:20px 24px; max-width:1280px; margin:0 auto; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
.tile .label { color:var(--ink2); font-size:12px; }
.tile .value { font-size:28px; font-weight:650; margin-top:2px; }
.tile .target { color:var(--muted); font-size:11px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; margin-top:12px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
.card h3 { margin:0 0 8px; font-size:13px; font-weight:650; color:var(--ink2); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--muted); font-weight:500; border-bottom:1px solid var(--grid);
  padding:6px 8px; white-space:nowrap; }
td { padding:6px 8px; border-bottom:1px solid var(--grid); vertical-align:top; }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
tr:hover td { background:color-mix(in srgb, var(--grid) 40%, transparent); }
.badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11.5px;
  border:1px solid var(--border); white-space:nowrap; }
.badge.P1 { border-color:var(--critical); }
.badge.P2 { border-color:var(--serious); }
.badge.P3 { border-color:var(--warning); }
.badge.P4 { border-color:var(--axis); }
.state { font-size:12px; white-space:nowrap; }
.state.breached  { color:var(--critical); font-weight:600; }
.state.escalate  { color:var(--serious); font-weight:600; }
.state.notify    { color:var(--warning); }
.state.on_track  { color:var(--good-text); }
.kev { color:var(--critical); font-weight:650; font-size:11px; letter-spacing:.04em; }
.controls { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; align-items:center; }
input, select, button.btn, textarea { font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--axis); border-radius:6px; padding:6px 10px; }
button.btn { cursor:pointer; }
button.btn.primary { background:var(--series); color:#fff; border-color:var(--series); }
button.mini { font-size:11.5px; padding:2px 8px; cursor:pointer; background:none;
  border:1px solid var(--axis); border-radius:6px; color:var(--ink2); }
button.mini:hover { border-color:var(--series); color:var(--series); }
#tooltip { position:fixed; pointer-events:none; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.18); display:none; z-index:10; }
.empty { color:var(--muted); padding:16px 0; }
svg text { font:11px system-ui,-apple-system,"Segoe UI",sans-serif; fill:var(--muted); }
svg .val { fill:var(--ink2); font-variant-numeric:tabular-nums; }
.toast { position:fixed; bottom:20px; right:20px; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-left:4px solid var(--series); border-radius:8px;
  padding:10px 16px; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:20; max-width:420px; }
.toast.err { border-left-color:var(--critical); }
dialog { background:var(--surface); color:var(--ink); border:1px solid var(--border);
  border-radius:12px; padding:20px; min-width:340px; }
dialog::backdrop { background:rgba(0,0,0,.4); }
dialog label { display:block; margin:10px 0 4px; color:var(--ink2); font-size:12.5px; }
dialog input, dialog textarea { width:100%; }
.row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.meta-line { color:var(--muted); font-size:11.5px; margin-top:10px; }
</style>
</head>
<body>
<div class="demobar">⚡ Interactive demo — runs entirely in your browser, data resets on refresh.
  The real application is a FastAPI + SQLite server with live CISA KEV / EPSS / NVD enrichment — see the repository.</div>
<header>
  <div><h1>vulnmgmt</h1><div class="sub">risk-based vulnerability management · NIST 800-40 · CIS 7</div></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="tooltip"></div>

<script>
"use strict";
/* ================================================================ in-browser backend
   A faithful client-side port of the FastAPI server's scoring, SLA, and
   metrics engine, seeded with a realistic programme history. In the real
   app this state lives in SQLite and enrichment hits the live CISA KEV
   feed, FIRST.org EPSS API, and NVD. */
const DAY = 864e5;
const nowD = () => new Date();
const ago = d => new Date(Date.now() - d * DAY);
const iso = d => d.toISOString().slice(0, 19);
const CRIT_W = { critical: 1.0, high: 0.7, medium: 0.4, low: 0.1 };
const PRI = ["P1", "P2", "P3", "P4"];

const KEV = new Set(["CVE-2024-3400", "CVE-2023-44487", "CVE-2019-0708", "CVE-2022-22965",
  "CVE-2024-1086", "CVE-2023-4966", "CVE-2023-22515", "CVE-2020-1472", "CVE-2024-21887"]);
const EPSS = { "CVE-2024-3400": .97, "CVE-2023-44487": .97, "CVE-2024-6387": .92,
  "CVE-2024-1086": .28, "CVE-2022-22965": .96, "CVE-2019-0708": .95, "CVE-2023-45853": .03,
  "CVE-2024-6345": .02, "CVE-2024-28085": .02, "CVE-2024-35195": .004, "CVE-2021-3449": .63,
  "CVE-2023-38408": .80, "CVE-2023-4966": .96, "CVE-2023-22515": .94, "CVE-2023-38545": .35,
  "CVE-2023-48795": .12, "CVE-2020-1472": .96, "CVE-2024-21887": .94 };

let cfg = { sla_days: { P1: 7, P2: 30, P3: 90, P4: 180 }, kev_target_hours: 72,
  sla_target_pct: 92, ticket_min: "P2" };

const assets = [
  A("pan-fw-edge-01", "critical", 1, "network-team", 0),
  A("web-lb-01", "high", 1, "web-team", 1),
  A("db-prod-01", "critical", 0, "dba-team", 0),
  A("jump-host-01", "high", 1, "infra-team", 0),
  A("legacy-app-03", "medium", 0, "app-team", 0),
  A("dev-tomcat-07", "low", 0, "dev-team", 0),
  A("payments-api:2.4.1 (debian 12.5)", "critical", 1, "payments-team", 0),
  A("build-agent-02", "medium", 0, "ci-team", 0),
  A("mail-relay-01", "medium", 0, "infra-team", 0),
  A("citrix-adc-01", "critical", 1, "network-team", 0),
  A("wiki-01", "medium", 0, "app-team", 0),
];
function A(hostname, criticality, internet_facing, owner, compensating_control) {
  return { hostname, criticality, internet_facing, owner, compensating_control,
           created_at: iso(ago(150)) };
}

let nextId = 1;
const findings = [];
function F(asset, cve, cvss, title, det, o = {}) {
  findings.push({ id: nextId++, asset, cve, cvss, title, solution: o.solution || null,
    source: o.source || "nessus", detected_at: iso(ago(det)),
    remediated_at: o.rem != null ? iso(ago(o.rem)) : null,
    verified_at: o.ver != null ? iso(ago(o.ver)) : null,
    status: o.status || (o.ver != null ? "verified" : "open"),
    reopened: o.reopened || 0, accepted_until: o.until || null,
    accepted_reason: o.reason || null, epss: null, kev: 0, risk_score: null,
    priority: null, due_at: null });
}
/* programme history — dwell time trending down across ~5 months */
F("citrix-adc-01", "CVE-2023-4966", 9.4, "Citrix NetScaler ADC Session Hijack (Citrix Bleed)", 40, { ver: 38 });
F("wiki-01", "CVE-2023-22515", 10.0, "Atlassian Confluence Privilege Escalation", 12, { ver: 9.5 });
F("web-lb-01", "CVE-2023-38545", 9.8, "curl SOCKS5 Heap Buffer Overflow", 140, { ver: 118 });
F("mail-relay-01", "CVE-2023-5678", 5.3, "OpenSSL DH Key Generation DoS", 132, { ver: 112 });
F("jump-host-01", "CVE-2023-48795", 5.9, "SSH Terrapin Prefix Truncation", 105, { ver: 89 });
F("db-prod-01", "CVE-2024-0727", 5.5, "OpenSSL PKCS12 NULL Dereference", 98, { ver: 84 });
F("build-agent-02", "CVE-2024-2511", 5.9, "OpenSSL Session Cache DoS", 70, { ver: 61 });
F("pan-fw-edge-01", "CVE-2024-3596", 9.0, "RADIUS Blast-RADIUS Forgery", 68, { ver: 59 });
F("web-lb-01", "CVE-2022-48174", 9.8, "BusyBox Stack Overflow", 66, { ver: 58 });
F("mail-relay-01", "CVE-2024-28182", 7.5, "nghttp2 CONTINUATION Flood", 38, { ver: 33.5 });
F("dev-tomcat-07", "CVE-2024-23897", 9.8, "Jenkins CLI Arbitrary File Read", 15, { ver: 13 });
F("wiki-01", "CVE-2024-4367", 5.6, "PDF.js Arbitrary JS Execution", 10, { ver: 8, reopened: 1 });
/* open backlog */
F("pan-fw-edge-01", "CVE-2024-3400", 10.0, "PAN-OS GlobalProtect Command Injection", 2,
  { solution: "Upgrade to PAN-OS 10.2.9-h1 / 11.0.4-h1 or later." });
F("web-lb-01", "CVE-2023-44487", 7.5, "HTTP/2 Rapid Reset DDoS", 20,
  { solution: "Apply vendor patches for HTTP/2 rapid reset." });
F("jump-host-01", "CVE-2024-6387", 8.1, "OpenSSH regreSSHion RCE", 26,
  { solution: "Upgrade to OpenSSH 9.8p1 or later." });
F("db-prod-01", "CVE-2024-1086", 7.8, "Linux Kernel netfilter Use-After-Free", 4,
  { solution: "Update kernel to 6.1.76 / 6.6.15 or later." });
F("dev-tomcat-07", "CVE-2022-22965", 9.8, "Spring4Shell RCE", 6.5,
  { solution: "Upgrade Spring Framework to 5.3.18 or later." });
F("legacy-app-03", "CVE-2019-0708", 9.8, "Microsoft RDP BlueKeep RCE", 30,
  { status: "accepted", until: iso(new Date(Date.now() + 60 * DAY)),
    reason: "Isolated to management VLAN; firewall blocks 3389 except jump host; decommission scheduled next quarter." });
F("payments-api:2.4.1 (debian 12.5)", "CVE-2023-45853", 9.8, "zlib integer overflow in zipOpenNewFileInZip4_64", 10,
  { source: "trivy", solution: "Rebuild image from patched base." });
F("payments-api:2.4.1 (debian 12.5)", "CVE-2024-6345", 8.8, "setuptools remote code execution via download functions", 33,
  { source: "trivy", solution: "upgrade setuptools to 70.0.0" });
F("payments-api:2.4.1 (debian 12.5)", "CVE-2024-28085", 6.7, "util-linux wall escape sequence injection", 45,
  { source: "trivy", solution: "upgrade util-linux to 2.38.1-5+deb12u1" });
F("payments-api:2.4.1 (debian 12.5)", "CVE-2024-35195", 5.6, "requests certificate verification bypass", 95,
  { source: "trivy", solution: "upgrade requests to 2.32.0" });
F("mail-relay-01", "CVE-2021-3449", 5.9, "OpenSSL NULL Pointer Dereference", 15,
  { solution: "Upgrade to OpenSSL 1.1.1k or later." });
F("build-agent-02", "CVE-2023-38408", 9.8, "OpenSSH ssh-agent Forwarding RCE", 8,
  { solution: "Upgrade to OpenSSH 9.3p2 or later." });

const activity = [{ ts: iso(nowD()), actor: "system", action: "demo_seeded",
  detail: `${findings.length} findings across ${assets.length} assets, ~5 months of programme history` }];
function log(actor, action, detail) { activity.unshift({ ts: iso(nowD()), actor, action, detail }); }

/* ---- scoring engine (port of app.py) ---- */
function priorityOf(cvss, epss, kev, crit, inet) {
  cvss = cvss || 0;
  if (kev || (cvss >= 9 && (epss || 0) >= 0.5 && (inet || crit === "critical"))) return "P1";
  if (cvss >= 7) return "P2";
  if (cvss >= 4) return "P3";
  return "P4";
}
function riskScore(cvss, epss, crit, inet, comp) {
  let s = ((cvss || 0) / 10) * 20 + (epss || 0) * 30 + (CRIT_W[crit] ?? 0.4) * 25;
  s += inet ? 15 : 0; s -= comp ? 10 : 0;
  return Math.round(Math.max(s, 0) * 10) / 10;
}
function assetOf(name) { return assets.find(a => a.hostname === name); }
function enrichOne(f) {
  const a = assetOf(f.asset) || { criticality: "medium", internet_facing: 0, compensating_control: 0 };
  f.epss = EPSS[f.cve] ?? 0.05;
  f.kev = KEV.has(f.cve) ? 1 : 0;
  f.priority = priorityOf(f.cvss, f.epss, f.kev, a.criticality, a.internet_facing);
  f.risk_score = riskScore(f.cvss, f.epss, a.criticality, a.internet_facing, a.compensating_control);
  f.due_at = iso(new Date(new Date(f.detected_at).getTime() + cfg.sla_days[f.priority] * DAY));
}
function enrichAll() { findings.forEach(enrichOne); }
enrichAll();

function slaStateOf(f) {
  if (!f.due_at) return [null, null];
  const det = new Date(f.detected_at), due = new Date(f.due_at), n = Date.now();
  const frac = due > det ? (n - det) / (due - det) : 2;
  const state = n > due ? "breached" : frac >= 0.9 ? "escalate" : frac >= 0.5 ? "notify" : "on_track";
  return [state, Math.round(Math.min(frac, 2) * 100)];
}

function computeMetrics() {
  const m = { generated_at: iso(nowD()), config: cfg,
    totals: { open: 0, remediated: 0, verified: 0, accepted: 0 },
    mttr_days: {}, sla_pct: {}, priority_open: {},
    backlog_age: { "0-7": 0, "8-30": 0, "31-90": 0, "90+": 0 },
    kev_open: [], kev_exposure_hours: null, recurrence_pct: null,
    escalations: [], slow_owners: [], dwell_trend: [],
    kev_feed: { fetched_at: iso(nowD()), entries: 1655, catalog_version: "2026.07.27 (demo snapshot)" } };
  const dwell = {}, compliant = {}, breached = {}, kevH = [], owners = {}, monthly = {};
  let reopens = 0;
  for (const f of findings) {
    if (!f.priority) continue;
    const det = new Date(f.detected_at);
    m.totals[f.status]++; reopens += f.reopened;
    if (f.status === "verified") {
      const ver = new Date(f.verified_at), d = (ver - det) / DAY;
      (dwell[f.priority] ??= []).push(d);
      const b = f.verified_at <= f.due_at ? compliant : breached;
      b[f.priority] = (b[f.priority] || 0) + 1;
      if (f.kev) kevH.push(d * 24);
      const owner = (assetOf(f.asset) || {}).owner || "unassigned";
      (owners[owner] ??= []).push(d);
      (monthly[f.verified_at.slice(0, 7)] ??= []).push(d);
    } else if (f.status === "open" || f.status === "remediated") {
      m.priority_open[f.priority] = (m.priority_open[f.priority] || 0) + 1;
      const age = (Date.now() - det) / DAY;
      m.backlog_age[age <= 7 ? "0-7" : age <= 30 ? "8-30" : age <= 90 ? "31-90" : "90+"]++;
      if (f.kev) m.kev_open.push({ id: f.id, asset: f.asset, cve: f.cve,
        hours_open: Math.round((Date.now() - det) / 36e5) });
      const [state] = slaStateOf(f);
      if (state === "breached") {
        breached[f.priority] = (breached[f.priority] || 0) + 1;
        m.escalations.push({ id: f.id, asset: f.asset, cve: f.cve, priority: f.priority, state });
      } else if (state === "escalate" || state === "notify")
        m.escalations.push({ id: f.id, asset: f.asset, cve: f.cve, priority: f.priority, state });
    }
  }
  for (const p of PRI) {
    if (dwell[p]) m.mttr_days[p] = Math.round(dwell[p].reduce((a, b) => a + b) / dwell[p].length * 10) / 10;
    const tot = (compliant[p] || 0) + (breached[p] || 0);
    if (tot) m.sla_pct[p] = Math.round(1000 * (compliant[p] || 0) / tot) / 10;
  }
  if (kevH.length) m.kev_exposure_hours = Math.round(kevH.reduce((a, b) => a + b) / kevH.length);
  if (m.totals.verified || reopens)
    m.recurrence_pct = Math.round(1000 * reopens / (m.totals.verified + reopens)) / 10;
  m.slow_owners = Object.entries(owners).map(([owner, d]) => ({ owner,
    avg_dwell_days: Math.round(d.reduce((a, b) => a + b) / d.length * 10) / 10, closed: d.length }))
    .sort((a, b) => b.avg_dwell_days - a.avg_dwell_days).slice(0, 10);
  m.dwell_trend = Object.entries(monthly).sort().map(([month, d]) => ({ month,
    avg_dwell_days: Math.round(d.reduce((a, b) => a + b) / d.length * 10) / 10, closed: d.length })).slice(-12);
  return m;
}

/* sample scans for the Import tab */
const SAMPLE_SCANS = {
  nessus: { name: "nessus_export.csv", source: "nessus", rows: [
    { asset: "vpn-gw-02", cve: "CVE-2024-21887", cvss: 9.1, title: "Ivanti Connect Secure Command Injection", solution: "Apply Ivanti mitigation XML / patch." },
    { asset: "file-srv-01", cve: "CVE-2020-1472", cvss: 10.0, title: "Netlogon Zerologon Privilege Escalation", solution: "Apply August 2020 update; enforce secure RPC." },
    { asset: "file-srv-01", cve: "CVE-2017-0144", cvss: 8.1, title: "SMBv1 EternalBlue RCE", solution: "Disable SMBv1; apply MS17-010." },
    { asset: "web-lb-01", cve: "CVE-2023-44487", cvss: 7.5, title: "HTTP/2 Rapid Reset DDoS", solution: "Apply vendor patches." }] },
  trivy: { name: "trivy_scan.json", source: "trivy", rows: [
    { asset: "checkout-svc:1.9.0 (alpine 3.19)", cve: "CVE-2024-6119", cvss: 7.5, title: "OpenSSL X.509 name check DoS", solution: "upgrade libssl3 to 3.3.2-r0" },
    { asset: "checkout-svc:1.9.0 (alpine 3.19)", cve: "CVE-2024-45491", cvss: 9.8, title: "libexpat integer overflow", solution: "upgrade expat to 2.6.3-r0" },
    { asset: "checkout-svc:1.9.0 (alpine 3.19)", cve: "CVE-2024-37371", cvss: 9.1, title: "MIT Kerberos GSS message token handling", solution: "upgrade krb5 to 1.21.3-r0" }] },
};
function importScan(which) {
  const scan = SAMPLE_SCANS[which];
  let added = 0, reopened = 0, still = 0;
  for (const r of scan.rows) {
    if (!assetOf(r.asset))
      assets.push(A(r.asset, "medium", 0, "unassigned", 0));
    const old = findings.find(f => f.asset === r.asset && f.cve === r.cve);
    if (!old) { F(r.asset, r.cve, r.cvss, r.title, 0, { solution: r.solution, source: scan.source }); added++; }
    else if (old.status === "verified") {
      Object.assign(old, { status: "open", detected_at: iso(nowD()), remediated_at: null,
        verified_at: null, reopened: old.reopened + 1 });
      reopened++;
    } else still++;
  }
  enrichAll();
  log("demo-user", "import", `${scan.name}: ${added} new, ${reopened} reopened, ${still} still present`);
  return { new: added, reopened, still_present: still, source: scan.source };
}

/* ---- mock API router: same routes as the FastAPI server ---- */
async function api(path, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  const body = opts.body || {};
  const [p, qs] = path.split("?");
  const q = new URLSearchParams(qs || "");
  await new Promise(r => setTimeout(r, 30)); // whisper of latency for realism
  if (p === "/metrics") return computeMetrics();
  if (p === "/config" && method === "GET") return cfg;
  if (p === "/config" && method === "PUT") {
    if (body.sla_days) for (const k of PRI) cfg.sla_days[k] = +body.sla_days[k] || cfg.sla_days[k];
    if (body.kev_target_hours) cfg.kev_target_hours = +body.kev_target_hours;
    if (body.sla_target_pct) cfg.sla_target_pct = +body.sla_target_pct;
    if (body.ticket_min) cfg.ticket_min = body.ticket_min;
    enrichAll(); log("demo-user", "config_update", JSON.stringify(cfg.sla_days));
    return cfg;
  }
  if (p === "/findings") {
    let out = findings.filter(f =>
      (!q.get("status") || f.status === q.get("status")) &&
      (!q.get("priority") || f.priority === q.get("priority")) &&
      (q.get("kev_only") !== "true" || f.kev) &&
      (!q.get("q") || (f.cve + f.asset + (f.title || "")).toLowerCase().includes(q.get("q").toLowerCase())));
    out = out.slice().sort((a, b) => (b.risk_score || 0) - (a.risk_score || 0)).map(f => {
      const d = { ...f, owner: (assetOf(f.asset) || {}).owner || "unassigned" };
      if ((f.status === "open" || f.status === "remediated") && f.due_at)
        [d.sla_state, d.sla_pct_elapsed] = slaStateOf(f);
      return d;
    });
    return { findings: out, config: cfg };
  }
  const act = p.match(/^\/findings\/(\d+)\/action$/);
  if (act) {
    const f = findings.find(x => x.id === +act[1]);
    if (!f) throw new Error("finding not found");
    const a = body.action;
    if (a === "remediate" && f.status === "open") { f.status = "remediated"; f.remediated_at = iso(nowD()); }
    else if (a === "verify" && f.status === "remediated") { f.status = "verified"; f.verified_at = iso(nowD()); }
    else if (a === "verify_failed" && f.status === "remediated") {
      f.status = "open"; f.remediated_at = null; f.reopened++;
    } else if (a === "accept") {
      if (!body.reason || !body.until) throw new Error("risk acceptance requires reason and expiry");
      f.status = "accepted"; f.accepted_until = body.until + "T00:00:00"; f.accepted_reason = body.reason;
    } else if (a === "reopen") {
      Object.assign(f, { status: "open", remediated_at: null, verified_at: null, accepted_until: null });
    } else throw new Error(`cannot ${a} a ${f.status} finding (rescan gate)`);
    log("demo-user", "finding_" + a, `#${f.id} ${f.asset} ${f.cve}`);
    return f;
  }
  if (p === "/assets" && method === "GET")
    return assets.map(a => ({ ...a, open_findings: findings.filter(f => f.asset === a.hostname &&
      (f.status === "open" || f.status === "remediated")).length }))
      .sort((x, y) => x.hostname.localeCompare(y.hostname));
  if (p === "/assets" && method === "POST") {
    if (!body.hostname) throw new Error("hostname required");
    const ex = assetOf(body.hostname.trim());
    const upd = { hostname: body.hostname.trim(), criticality: body.criticality || "medium",
      internet_facing: body.internet_facing ? 1 : 0, owner: body.owner || "unassigned",
      compensating_control: body.compensating_control ? 1 : 0, created_at: iso(nowD()) };
    if (ex) Object.assign(ex, upd); else assets.push(upd);
    enrichAll(); log("demo-user", "asset_upsert", upd.hostname);
    return { ok: true };
  }
  const del = p.match(/^\/assets\/(.+)$/);
  if (del && method === "DELETE") {
    const i = assets.findIndex(a => a.hostname === decodeURIComponent(del[1]));
    if (i >= 0) assets.splice(i, 1);
    enrichAll(); return { ok: true };
  }
  if (p === "/enrich") {
    enrichAll(); log("demo-user", "enrich", `rescored ${findings.length} findings (demo snapshot of KEV/EPSS)`);
    return { rescored: findings.length };
  }
  if (p === "/activity") return activity;
  if (p === "/connectors/test")
    return { webhook: "demo mode — connectors run in the real server", jira: "demo mode — connectors run in the real server" };
  throw new Error("demo: route not implemented — run the real server for this");
}

  const a = document.createElement("a");

}

  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "–" : n;
function toast(msg, err) {

  t.className = "toast" + (err ? " err" : ""); t.textContent = msg;

const tip = document.getElementById("tooltip");
function hover(el, html) {
  el.addEventListener("mousemove", e => {
    tip.innerHTML = html; tip.style.display = "block";

  });
  el.addEventListener("mouseleave", () => tip.style.display = "none");
}
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function barChart(rows, { unit = "", max = null, color = "var(--series)" } = {}) {
  const W = 460, rowH = 26, padL = 110, padR = 60, H = rows.length * rowH + 8;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
  const maxV = max ?? Math.max(1, ...rows.map(r => r.value));
  rows.forEach((r, i) => {
    const y = i * rowH + 4, w = Math.max(2, (r.value / maxV) * (W - padL - padR));
    el("text", { x: padL - 8, y: y + 14, "text-anchor": "end" }, svg).textContent = r.label;
    const bar = el("rect", { x: padL, y, width: w, height: 16, rx: 4, fill: r.color || color }, svg);
    const t = el("text", { x: padL + w + 6, y: y + 13, class: "val" }, svg);
    t.textContent = r.value + unit;
    hover(bar, `<b>${esc(r.label)}</b><br>${esc(r.hint ?? r.value + unit)}`);
  });
  return svg;
}
function lineChart(pts, { unit = "" } = {}) {
  const W = 460, H = 170, padL = 36, padR = 14, padT = 12, padB = 26;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
  if (pts.length === 0) return svg;
  const maxV = Math.max(1, ...pts.map(p => p.y)) * 1.15;
  const x = i => padL + (pts.length === 1 ? (W - padL - padR) / 2
                : i * (W - padL - padR) / (pts.length - 1));
  const y = v => H - padB - (v / maxV) * (H - padT - padB);
  for (let g = 0; g <= 3; g++) {
    const gy = padT + g * (H - padT - padB) / 3;
    el("line", { x1: padL, x2: W - padR, y1: gy, y2: gy, stroke: "var(--grid)" }, svg);
    el("text", { x: padL - 6, y: gy + 4, "text-anchor": "end" }, svg)
      .textContent = Math.round(maxV * (1 - g / 3));
  }
  el("line", { x1: padL, x2: W - padR, y1: H - padB, y2: H - padB, stroke: "var(--axis)" }, svg);
  if (pts.length > 1)
    el("polyline", { points: pts.map((p, i) => `${x(i)},${y(p.y)}`).join(" "),
      fill: "none", stroke: "var(--series)", "stroke-width": 2 }, svg);
  pts.forEach((p, i) => {
    const c = el("circle", { cx: x(i), cy: y(p.y), r: 4, fill: "var(--series)",
      stroke: "var(--surface)", "stroke-width": 2 }, svg);
    hover(c, `<b>${esc(p.label)}</b><br>${esc(p.hint ?? p.y + unit)}`);
    const step = Math.ceil(pts.length / 8);
    if (i % step === 0 || i === pts.length - 1)
      el("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, svg).textContent = p.label;
  });
  return svg;
}

async function doAction(btn, reload) {

function modal(html) {
  return new Promise(resolve => {
    const dlg = document.createElement("dialog");
    dlg.innerHTML = html + `<div class="row"><button class="btn" id="m-cancel">Cancel</button>
      <button class="btn primary" id="m-ok">Confirm</button></div>`;
    document.body.appendChild(dlg); dlg.showModal();
    dlg.querySelector("#m-cancel").onclick = () => { dlg.remove(); resolve(null); };
    dlg.querySelector("#m-ok").onclick = () => {
      const out = { reason: dlg.querySelector("#m-reason")?.value.trim(),
                    until: dlg.querySelector("#m-until")?.value };

  });
}

    <h3>SLA policy (days to remediate, by priority)</h3>
    <table>${PRI.map(p => `<tr><td><span class="badge ${p}">${p}</span></td>
      <td>${{P1:"KEV-listed, or CVSS≥9 + EPSS≥0.5 on exposed/critical asset",
             P2:"CVSS 7–8.9", P3:"CVSS 4–6.9", P4:"CVSS &lt;4"}[p]}</td>
      <td class="num"><input id="sla-${p}" type="number" min="1" style="width:70px"
        value="${c.sla_days[p]}"></td></tr>`).join("")}</table>
    <label style="display:block;margin-top:10px;color:var(--ink2)">KEV exposure-window target (hours)
      <input id="kev-h" type="number" min="1" style="width:90px" value="${c.kev_target_hours}"></label>
    <label style="display:block;margin-top:6px;color:var(--ink2)">SLA compliance target (%)
      <input id="sla-t" type="number" min="1" max="100" style="width:90px" value="${c.sla_target_pct}"></label>
    <div class="row"><button class="btn primary" id="cfg-save">Save — rescores all open findings</button></div>
  </div>
  <div class="card" style="max-width:520px;margin-top:12px">
    <h3>Connectors — notifications &amp; ticketing</h3>
    <p style="color:var(--ink2);margin:4px 0">In the real server this tab configures a
      <b>Slack/Discord webhook</b> (import summaries + SLA alerts at 50%/90%/breach) and
      <b>Jira</b> (auto-created tickets with SLA due dates, rescan results as comments) — with a
      live connection test. Disabled in the browser demo.</p>
    <div class="row"><button class="btn" id="cn-test">Test connectors</button></div>
  </div>`;
  document.getElementById("cfg-save").onclick = async () => {
    await api("/config", { method: "PUT", body: {
      sla_days: Object.fromEntries(PRI.map(p => [p, document.getElementById("sla-" + p).value])),
      kev_target_hours: document.getElementById("kev-h").value,
      sla_target_pct: document.getElementById("sla-t").value } });
    toast("policy saved — open findings rescored");
  };
  document.getElementById("cn-test").onclick = async () => {
    const r = await api("/connectors/test", { method: "POST" });
    toast(`webhook: ${r.webhook} · jira: ${r.jira}`);
  };
}

go("dashboard");
</script>
</body>
</html>
